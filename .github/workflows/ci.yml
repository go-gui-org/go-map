name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only. Nothing here publishes, comments or tags, so the job token
# needs no more than the checkout.
permissions:
  contents: read

# go-map contains no cgo: no file in the module declares `import "C"` or
# a #cgo directive. Tile decoding is x/image, and drawing goes through
# go-gui, which is pure Go on Linux and Windows. The SDL2, FreeType,
# HarfBuzz, Pango and fontconfig packages this workflow used to install
# on both platforms were left over from go-glyph's cgo era and are gone.
#
# macOS keeps the toolchain default (cgo on) rather than being forced
# off. Nothing here needs it, but go-gui's Metal backend does, and a
# darwin build with cgo off still succeeds while linking no Metal at
# all -- so forcing it off would buy nothing and hide that failure.
jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          path: go-map

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Test
        working-directory: go-map
        run: go test ${{ runner.os == 'Linux' && '-race' || '' }} ./...

  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: go-map

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Vet
        working-directory: go-map
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: go-map
          args: ./...
